# ============================================================
# NexT theme customization (reconstructed from old deployed site)
# Original _config.next.yml / themes/next config was lost; restored
# from the previous deployment HTML on 2026-08-16.
# ============================================================

# Custom files (Arknights theme, watermark, giscus comments)
custom_file_path:
  style: source/_data/styles.styl
  bodyEnd: source/_data/body-end.njk
  postBodyEnd: source/_data/post-body-end.njk

# Scheme & dark mode
scheme: Gemini
darkmode: true

# Menu
menu:
  home: / || fa fa-home
  about: /about/ || fa fa-user
  tags: /tags/ || fa fa-tags
  categories: /categories/ || fa fa-th
  archives: /archives/ || fa fa-archive
menu_settings:
  icons: true
  badges: true

# Avatar
avatar:
  url: /images/qsc.jpg
  rounded: true
  rotated: false

# Social links
social:
  GitHub: https://github.com/qinsca || fab fa-github
  E-Mail: mailto:1744326850@qq.com || fa fa-envelope
social_icons:
  enable: true
  icons_only: false

# Code block highlight theme
codeblock:
  theme:
    light: foundation
    dark: foundation

# Visitor counter (busuanzi)
busuanzi_count:
  enable: true
  site_uv: true
  site_pv: true
  page_pv: false

# Dark mode toggle button (hexo-next-darkmode plugin)
darkmode_js:
  enable: true
# Local search (search.json via hexo-generator-searchdb)
local_search:
  enable: true
  trigger: auto
